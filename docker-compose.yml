services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: no_more_waste
      MYSQL_USER: nmw
      MYSQL_PASSWORD: nmw_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-go:
    build: ./api-go
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: nmw
      DB_PASSWORD: nmw_password
      DB_NAME: no_more_waste
      PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"

  # Serveur SMTP de développement : capture les mails envoyés par l'appli
  # (rappels de renouvellement) et les affiche sur http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  front-laravel:
    build: ./front-laravel
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api-go:8080/api
      # Adresse publique du site lui-même : utilisée par Laravel pour générer
      # des liens absolus (ex. lien de réinitialisation de mot de passe envoyé
      # par email) en dehors d'un contexte de requête HTTP, comme les
      # commandes artisan planifiées (adhesions:rappels). Servi en HTTPS via
      # le reverse proxy Caddy (voir service "caddy" ci-dessous).
      APP_URL: https://nomorewaste.cloud
      # Configuration SMTP : les valeurs viennent du fichier .env à la racine du
      # projet (non versionné, voir .env.example). Ces variables d'environnement
      # sont prioritaires sur le .env interne à Laravel, donc sans fichier .env on
      # retombe automatiquement sur Mailpit pour le développement.
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-contact@nomorewaste.fr}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-NO MORE WASTE}
    depends_on:
      mysql:
        condition: service_healthy
      api-go:
        condition: service_started
      mailpit:
        condition: service_started
    ports:
      - "8000:80"

  # Reverse proxy public : termine le HTTPS (certificat Let's Encrypt obtenu
  # et renouvelé automatiquement) pour nomorewaste.cloud et renvoie vers
  # front-laravel en interne. C'est lui qui écoute sur les ports 80/443.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - front-laravel

volumes:
  db_data:
  caddy_data:
  caddy_config:
